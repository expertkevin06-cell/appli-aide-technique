<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Générer les icônes</title></head>
<body style="font-family:sans-serif;text-align:center;padding:40px;background:#0b1220;color:#eaf2ff">
<h2>⚙️ Génération des icônes PNG</h2>
<p>icon-512.png puis icon-192.png vont se télécharger automatiquement.<br>Si le navigateur demande « autoriser plusieurs téléchargements », acceptez.</p>
<canvas id="c" width="512" height="512" style="width:128px;border-radius:20px"></canvas>
<script>
function draw(size){
 const c=document.getElementById('c');c.width=size;c.height=size;
 const x=c.getContext('2d'),u=size/512;
 const r=96*u;
 x.fillStyle='#0b1220';
 x.beginPath();x.moveTo(r,0);x.lineTo(size,0);x.arcTo(size,size,size-r,size,r);
 x.lineTo(0,size);x.arcTo(0,size,0,size-r,r);x.lineTo(0,0);x.arcTo(0,0,r,0,r);x.closePath();x.fill();
 x.strokeStyle='#3aa0ff';x.lineWidth=34*u;
 x.beginPath();x.arc(256*u,236*u,120*u,0,Math.PI*2);x.stroke();
 x.fillStyle='#22d3a5';x.beginPath();x.arc(256*u,236*u,34*u,0,Math.PI*2);x.fill();
 x.lineWidth=26*u;x.beginPath();
 x.moveTo(256*u,270*u);x.lineTo(256*u,356*u);
 x.moveTo(136*u,236*u);x.lineTo(222*u,236*u);
 x.moveTo(290*u,236*u);x.lineTo(376*u,236*u);x.stroke();
 x.fillStyle='#eaf2ff';x.font='bold '+(72*u)+'px Arial';x.textAlign='center';
 x.fillText('MRT',256*u,452*u);
 return c.toDataURL('image/png');
}
setTimeout(()=>{
 let a=document.createElement('a');a.href=draw(512);a.download='icon-512.png';a.click();
 setTimeout(()=>{let b=document.createElement('a');b.href=draw(192);b.download='icon-192.png';b.click();},800);
},400);
</script>
</body>
</html>
